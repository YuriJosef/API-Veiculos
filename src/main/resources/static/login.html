<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Frota de Veículos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        .tabs {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            color: #888;
            transition: 0.3s;
        }
        .tab.active {
            color: #1e3c72;
            border-bottom: 2px solid #1e3c72;
            margin-bottom: -2px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        label { display: block; margin-bottom: 6px; color: #555; font-size: 13px; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus { border-color: #2a5298; outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover { background: #1e3c72; }
        .msg { margin-top: 15px; font-size: 13px; text-align: center; }
        .error { color: #e74c3c; }
        .success { color: #2ecc71; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="tabs">
            <div id="tabLogin" class="tab active" onclick="switchTab('login')">Entrar</div>
            <div id="tabRegister" class="tab" onclick="switchTab('register')">Cadastrar</div>
        </div>

        <!-- Formulário de Login -->
        <form id="loginForm" onsubmit="realizarLogin(event)">
            <div class="form-group">
                <label>E-mail ou Usuário</label>
                <input type="text" id="loginUser" required placeholder="Digite seu e-mail">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="loginPass" required placeholder="Sua senha">
            </div>
            <button type="submit">Entrar no Sistema</button>
            <p id="loginMsg" class="msg error hidden"></p>
        </form>

        <!-- Formulário de Registro -->
        <form id="registerForm" class="hidden" onsubmit="realizarRegistro(event)">
            <div class="form-group">
                <label>Nome Completo</label>
                <input type="text" id="regNome" required placeholder="Seu nome">
            </div>
            <div class="form-group">
                <label>E-mail (Gmail)</label>
                <input type="email" id="regEmail" required placeholder="seuemail@gmail.com">
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="regPass" required placeholder="Crie uma senha">
            </div>
            <button type="submit">Criar Conta</button>
            <p id="regMsg" class="msg success hidden"></p>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            if (tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('tabRegister').classList.remove('active');
                document.getElementById('loginForm').classList.remove('hidden');
                document.getElementById('registerForm').classList.add('hidden');
            } else {
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('tabLogin').classList.remove('active');
                document.getElementById('registerForm').classList.remove('hidden');
                document.getElementById('loginForm').classList.add('hidden');
            }
        }

        function realizarRegistro(e) {
            e.preventDefault();
            const nome = document.getElementById('regNome').value;
            const email = document.getElementById('regEmail').value;
            const senha = document.getElementById('regPass').value;

            let usuarios = JSON.parse(localStorage.getItem('usuarios_frota')) || [];
            
            if(usuarios.some(u => u.email === email)) {
                const msg = document.getElementById('regMsg');
                msg.className = 'msg error';
                msg.innerText = 'Este e-mail já está cadastrado!';
                msg.classList.remove('hidden');
                return;
            }

            usuarios.push({ nome, email, senha });
            localStorage.setItem('usuarios_frota', JSON.stringify(usuarios));

            const msg = document.getElementById('regMsg');
            msg.className = 'msg success';
            msg.innerText = 'Conta criada com sucesso! Vá para a aba Entrar.';
            msg.classList.remove('hidden');
            document.getElementById('registerForm').reset();
        }

        function realizarLogin(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            // Conta padrão de teste
            if ((user === 'admin' || user === 'admin@gmail.com') && pass === '1234') {
                window.location.href = '/index.html';
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem('usuarios_frota')) || [];
            const encontrado = usuarios.find(u => (u.email === user || u.nome === user) && u.senha === pass);

            if (encontrado) {
                window.location.href = '/index.html';
            } else {
                const msg = document.getElementById('loginMsg');
                msg.innerText = 'E-mail ou senha incorretos! (Teste: admin / 1234)';
                msg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
