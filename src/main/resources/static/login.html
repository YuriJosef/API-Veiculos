<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso - Frota de Veículos</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { flex: 1; padding: 10px; cursor: pointer; font-weight: bold; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px; }
        .tab.active { color: #667eea; border-bottom-color: #667eea; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 13px; }
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus { border-color: #667eea; outline: none; }
        button {
            width: 100%;
            padding: 11px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover { background: #5563c1; }
        .msg { margin-top: 12px; font-size: 13px; }
        .error { color: #e74c3c; }
        .success { color: #2ecc71; }
        .form-section { display: none; }
        .form-section.active { display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🚗 Portal de Veículos</h2>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Entrar</div>
            <div class="tab" onclick="switchTab('register')">Registrar</div>
        </div>

        <!-- Formulário de Login -->
        <form id="loginForm" class="form-section active" onsubmit="realizarLogin(event)">
            <div class="input-group">
                <label>E-mail ou Usuário</label>
                <input type="text" id="loginUser" required placeholder="Seu e-mail ou admin">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="loginPass" required placeholder="Sua senha">
            </div>
            <button type="submit">Entrar</button>
            <p id="loginMsg" class="msg"></p>
        </form>

        <!-- Formulário de Registro -->
        <form id="registerForm" class="form-section" onsubmit="realizarRegistro(event)">
            <div class="input-group">
                <label>Nome Completo</label>
                <input type="text" id="regName" required placeholder="Seu nome">
            </div>
            <div class="input-group">
                <label>E-mail (Gmail)</label>
                <input type="email" id="regEmail" required placeholder="seuemail@gmail.com">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="regPass" required placeholder="Crie uma senha">
            </div>
            <button type="submit">Cadastrar Conta</button>
            <p id="regMsg" class="msg"></p>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            
            if(tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function realizarRegistro(e) {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;

            let usuarios = JSON.parse(localStorage.getItem('usuarios_app')) || [];
            
            if(usuarios.some(u => u.email === email)) {
                const msg = document.getElementById('regMsg');
                msg.className = 'msg error';
                msg.innerText = 'Este e-mail já está cadastrado!';
                return;
            }

            usuarios.push({ name, email, pass });
            localStorage.setItem('usuarios_app', JSON.stringify(usuarios));

            const msg = document.getElementById('regMsg');
            msg.className = 'msg success';
            msg.innerText = 'Cadastro realizado com sucesso! Vá para Entrar.';
            document.getElementById('registerForm').reset();
        }

        function realizarLogin(e) {
            e.preventDefault();
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;

            if(user === 'admin' && pass === '1234') {
                window.location.href = '/index.html';
                return;
            }

            let usuarios = JSON.parse(localStorage.getItem('usuarios_app')) || [];
            const encontrado = usuarios.find(u => (u.email === user || u.name === user) && u.pass === pass);

            if(encontrado) {
                window.location.href = '/index.html';
            } else {
                const msg = document.getElementById('loginMsg');
                msg.className = 'msg error';
                msg.innerText = 'Usuário ou senha incorretos!';
            }
        }
    </script>
</body>
</html>
