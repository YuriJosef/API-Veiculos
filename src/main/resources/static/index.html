<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorVault - Ultimate Car Database</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --accent: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --modal-bg: #1e1b4b;
        }

        body.light-mode {
            --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 50%, #cbd5e1 100%);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(0, 0, 0, 0.1);
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --accent: #db2777;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --modal-bg: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; transition: background 0.3s, color 0.3s; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden; }

        .hidden { display: none !important; }

        /* AUTH CONTAINER */
        #authScreen {
            width: 100%; max-width: 420px; padding: 40px;
            background: var(--glass-bg); backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .auth-tabs { display: flex; margin-bottom: 30px; background: rgba(0,0,0,0.1); border-radius: 12px; padding: 4px; }
        .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 8px; font-weight: 500; color: var(--text-muted); }
        .auth-tab.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4); }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 8px; color: var(--text-muted); }
        .input-group input {
            width: 100%; padding: 14px 16px; background: var(--glass-bg);
            border: 1px solid var(--glass-border); border-radius: 12px;
            color: var(--text-main); font-size: 15px;
        }
        .input-group input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }
        
        .btn-main {
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600;
            cursor: pointer; box-shadow: 0 10px 25px -5px rgba(99,102,241,0.4); text-align: center;
        }
        .btn-main:hover { transform: translateY(-2px); opacity: 0.95; }

        /* DASHBOARD SCREEN */
        #dashboardScreen { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
        header {
            background: var(--glass-bg); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border); padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 22px; font-weight: 700; background: linear-gradient(to right, #818cf8, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        
        .theme-toggle { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-main); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 16px; }
        .btn-logout { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .btn-logout:hover { background: #ef4444; color: white; }

        .main-content { max-width: 1300px; width: 100%; margin: 40px auto; padding: 0 20px; flex: 1; }
        .toolbar { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
        .search-bar { flex: 1; min-width: 280px; padding: 14px 20px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; color: var(--text-main); font-size: 16px; backdrop-filter: blur(10px); }
        .search-bar:focus { outline: none; border-color: var(--primary); }
        
        .btn-add { background: var(--primary); color: white; border: none; padding: 14px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .btn-add:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .card {
            background: var(--glass-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 16px; padding: 24px;
            cursor: pointer; position: relative; overflow: hidden;
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 20px 30px -10px rgba(0,0,0,0.3); border-color: var(--primary); }
        .card h3 { font-size: 20px; margin-bottom: 8px; color: var(--text-main); }
        .card p { color: var(--text-muted); font-size: 14px; margin: 4px 0; }
        .badge { display: inline-block; background: rgba(99, 102, 241, 0.2); color: #818cf8; padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; margin-top: 14px; border: 1px solid rgba(99, 102, 241, 0.3); }

        /* MODAL */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--modal-bg); border: 1px solid var(--glass-border); padding: 30px; border-radius: 20px; width: 100%; max-width: 450px; box-shadow: 0 25px 50px rgba(0,0,0,0.6); color: var(--text-main); }
        .modal-content h2 { margin-bottom: 20px; font-size: 22px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: rgba(128,128,128,0.2); color: var(--text-main); border: none; padding: 12px; border-radius: 10px; cursor: pointer; flex: 1; font-weight: 500; }
        .btn-cancel:hover { background: rgba(128,128,128,0.4); }
        .btn-delete { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); padding: 12px; border-radius: 10px; cursor: pointer; font-weight: 500; }
        .btn-delete:hover { background: #ef4444; color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- TELA DE AUTENTICAÇÃO -->
    <div id="authScreen">
        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchTab('login')">Entrar</div>
            <div class="auth-tab" onclick="switchTab('register')">Cadastrar</div>
        </div>

        <form id="authForm" onsubmit="handleAuth(event)">
            <div id="nameGroup" class="input-group hidden">
                <label>Nome Completo</label>
                <input type="text" id="regName" placeholder="Ex: Carlos Silva">
            </div>
            <div class="input-group">
                <label>E-mail (Gmail)</label>
                <input type="email" id="authEmail" required placeholder="seuemail@gmail.com">
            </div>
            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="authPass" required placeholder="••••••••">
            </div>
            <button type="submit" id="authBtn" class="btn-main">Entrar no Sistema</button>
        </form>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div id="dashboardScreen" class="hidden">
        <header>
            <div class="logo">⚡ MotorVault AI</div>
            <div class="user-info">
                <span id="welcomeUser" style="font-weight: 500;"></span>
                <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
                <button class="btn-logout" onclick="logout()">Sair</button>
            </div>
        </header>

        <div class="main-content">
            <div class="toolbar">
                <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Pesquisar modelo, marca, ano ou placa..." onkeyup="filterCars()">
                <button class="btn-add" onclick="openModal('add')">+ Adicionar Veículo</button>
            </div>

            <div id="carsGrid" class="grid"></div>
        </div>
    </div>

    <!-- MODAL DE ALERTA / SERVIÇO PERSONALIZADO -->
    <div id="customAlertModal" class="modal hidden" style="z-index: 2000;">
        <div class="modal-content" style="max-width: 380px; text-align: center;">
            <h3 id="alertTitle" style="margin-bottom: 12px; font-size: 20px; color: var(--primary);">Serviço</h3>
            <p id="alertMessage" style="color: var(--text-muted); margin-bottom: 25px; font-size: 15px; line-height: 1.5;"></p>
            <div id="alertButtons" style="display: flex; gap: 10px; justify-content: center;">
                <button type="button" class="btn-main" onclick="closeCustomAlert()">OK</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE ADICIONAR / EDITAR / VISUALIZAR CARRO -->
    <div id="carModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Detalhes do Veículo</h2>
            <form id="carForm" onsubmit="saveCar(event)">
                <input type="hidden" id="carId">
                <div class="input-group">
                    <label>Marca (Fabricante Real)</label>
                    <input type="text" id="carMarca" required placeholder="Ex: Volkswagen, Porsche, Toyota...">
                </div>
                <div class="input-group">
                    <label>Modelo</label>
                    <input type="text" id="carModelo" required placeholder="Ex: Fusca, 911 GT3, Supra...">
                </div>
                <div class="input-group">
                    <label>Ano</label>
                    <input type="number" id="carAno" required placeholder="Ex: 2024">
                </div>
                <div class="input-group">
                    <label>Placa</label>
                    <input type="text" id="carPlaca" required placeholder="Ex: ABC-1234">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-delete hidden" id="deleteBtn" onclick="deleteCurrentCar()">Excluir</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">Fechar</button>
                    <button type="submit" class="btn-main" id="saveCarBtn">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        let editingCarId = null;
        let alertCallback = null;
        
        let carsDatabase = [
            { id: 1, marca: "Volkswagen", modelo: "Fusca 1600", ano: 1975, placa: "ABC-1234", categoria: "Clássico Nacional" },
            { id: 2, marca: "Chevrolet", modelo: "Opala SS", ano: 1978, placa: "OPL-9988", categoria: "Muscle Brasileiro" },
            { id: 3, marca: "Fiat", modelo: "Uno Mille", ano: 1996, placa: "UNO-2010", categoria: "Popular" },
            { id: 4, marca: "Ford", modelo: "Maverick GT", ano: 1974, placa: "MAV-0077", categoria: "Muscle Car" },
            { id: 5, marca: "Toyota", modelo: "Supra MK4", ano: 1998, placa: "JDM-9999", categoria: "Esportivo JDM" },
            { id: 6, marca: "Nissan", modelo: "Skyline GT-R R34", ano: 2002, placa: "GTR-3434", categoria: "Super Esportivo" },
            { id: 7, marca: "Porsche", modelo: "911 GT3 RS", ano: 2023, placa: "PRS-9110", categoria: "Supercarro" },
            { id: 8, marca: "Ferrari", modelo: "F8 Tributo", ano: 2021, placa: "FER-4880", categoria: "Supercarro" },
            { id: 9, marca: "Lamborghini", modelo: "Aventador SVJ", ano: 2020, placa: "LMB-6666", categoria: "Hipercarro" },
            { id: 10, marca: "Honda", modelo: "Civic Type R", ano: 2023, placa: "HND-0192", categoria: "Hatch Esportivo" },
            { id: 11, marca: "Chevrolet", modelo: "Corvette Z06", ano: 2023, placa: "VET-0707", categoria: "Esportivo" },
            { id: 12, marca: "Dodge", modelo: "Charger SRT Hellcat", ano: 2022, placa: "HLT-6622", categoria: "Muscle Car" },
            { id: 13, marca: "BMW", modelo: "M4 Competition", ano: 2023, placa: "BMW-2024", categoria: "Esportivo de Luxo" },
            { id: 14, marca: "Audi", modelo: "R8 V10 Performance", ano: 2022, placa: "AUD-8888", categoria: "Supercarro" },
            { id: 15, marca: "Subaru", modelo: "Impreza WRX STI", ano: 2004, placa: "WRX-2004", categoria: "Rally" }
        ];

        const authorizedBrands = [
            "volkswagen", "chevrolet", "fiat", "ford", "toyota", "nissan", "porsche", "ferrari", 
            "lamborghini", "honda", "dodge", "bmw", "audi", "subaru", "mercedes-benz", "hyundai", 
            "kia", "renault", "peugeot", "jeep", "mitsubishi", "volvo", "land rover", "mclaren", 
            "bugatti", "aston martin", "mazda", "lexus", "tesla", "alfa romeo", "maserati", "bentley",
            "rolls-royce", "mini", "chery", "byd", "jac", "ssangyong", "citroën", "chrysler", "ram"
        ];

        function showCustomAlert(message, callback = null) {
            document.getElementById('alertTitle').innerText = 'Serviço';
            document.getElementById('alertMessage').innerText = message;
            document.getElementById('alertButtons').innerHTML = `<button type="button" class="btn-main" onclick="closeCustomAlert()">OK</button>`;
            document.getElementById('customAlertModal').classList.remove('hidden');
            alertCallback = callback;
        }

        function showCustomConfirm(message, onConfirm) {
            document.getElementById('alertTitle').innerText = 'Serviço';
            document.getElementById('alertMessage').innerText = message;
            document.getElementById('alertButtons').innerHTML = `
                <button type="button" class="btn-cancel" onclick="closeCustomAlert()">Não</button>
                <button type="button" class="btn-main" id="confirmYesBtn" style="flex: 1;">Sim</button>
            `;
            document.getElementById('customAlertModal').classList.remove('hidden');
            document.getElementById('confirmYesBtn').onclick = () => {
                closeCustomAlert();
                if (onConfirm) onConfirm();
            };
        }

        function closeCustomAlert() {
            document.getElementById('customAlertModal').classList.add('hidden');
            if (alertCallback) {
                const cb = alertCallback;
                alertCallback = null;
                cb();
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeBtn').innerText = isLight ? '☀️' : '🌙';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        if(localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            document.getElementById('themeBtn').innerText = '☀️';
        }

        function switchTab(tab) {
            isLoginMode = tab === 'login';
            document.querySelectorAll('.auth-tab').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            
            if (isLoginMode) {
                document.getElementById('nameGroup').classList.add('hidden');
                document.getElementById('authBtn').innerText = 'Entrar no Sistema';
            } else {
                document.getElementById('nameGroup').classList.remove('hidden');
                document.getElementById('authBtn').innerText = 'Criar Conta';
            }
        }

        function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPass').value;

            if (isLoginMode) {
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                const found = users.find(u => u.email === email && u.pass === pass);
                if (found || (email === 'admin@gmail.com' && pass === '1234')) {
                    const userName = found ? found.name : 'Administrador';
                    startApp(userName);
                } else {
                    showCustomAlert('E-mail ou senha incorretos! Verifique seus dados.');
                }
            } else {
                const name = document.getElementById('regName').value;
                const users = JSON.parse(localStorage.getItem('users') || '[]');
                
                if(users.some(u => u.email === email)) {
                    showCustomAlert('Este e-mail já está cadastrado!', () => {
                        document.querySelectorAll('.auth-tab')[0].click();
                        document.getElementById('authEmail').value = email;
                        document.getElementById('authPass').value = '';
                        document.getElementById('authPass').focus();
                    });
                    return;
                }

                users.push({ name, email, pass });
                localStorage.setItem('users', JSON.stringify(users));
                
                showCustomAlert('Conta criada com sucesso! Faça login.', () => {
                    document.querySelectorAll('.auth-tab')[0].click();
                    document.getElementById('authEmail').value = email;
                    document.getElementById('authPass').value = '';
                    document.getElementById('authPass').focus();
                });
            }
        }

        function startApp(userName) {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
            document.getElementById('welcomeUser').innerText = `Olá, ${userName}`;
            renderCars(carsDatabase);
        }

        function logout() {
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('authForm').reset();
        }

        function renderCars(list) {
            const grid = document.getElementById('carsGrid');
            grid.innerHTML = '';
            if (list.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">Nenhum veículo encontrado.</p>`;
                return;
            }
            list.forEach(car => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal('edit', car.id);
                card.innerHTML = `
                    <h3>${car.marca} ${car.modelo}</h3>
                    <p>📅 <strong>Ano:</strong> ${car.ano}</p>
                    <p>🏷️ <strong>Placa:</strong> ${car.placa}</p>
                    <span class="badge">ID: #${car.id}</span>
                `;
                grid.appendChild(card);
            });
        }

        function filterCars() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = carsDatabase.filter(c => 
                c.modelo.toLowerCase().includes(query) ||
                c.marca.toLowerCase().includes(query) ||
                c.ano.toString().includes(query) ||
                c.placa.toLowerCase().includes(query)
            );
            renderCars(filtered);
        }

        function openModal(mode, id = null) {
            const modal = document.getElementById('carModal');
            modal.classList.remove('hidden');
            const deleteBtn = document.getElementById('deleteBtn');
            
            if (mode === 'add') {
                document.getElementById('modalTitle').innerText = 'Adicionar Novo Veículo';
                document.getElementById('carForm').reset();
                document.getElementById('carId').value = '';
                deleteBtn.classList.add('hidden');
                editingCarId = null;
            } else if (mode === 'edit') {
                document.getElementById('modalTitle').innerText = 'Editar / Ver Veículo';
                deleteBtn.classList.remove('hidden');
                const car = carsDatabase.find(c => c.id === id);
                if (car) {
                    editingCarId = car.id;
                    document.getElementById('carId').value = car.id;
                    document.getElementById('carMarca').value = car.marca;
                    document.getElementById('carModelo').value = car.modelo;
                    document.getElementById('carAno').value = car.ano;
                    document.getElementById('carPlaca').value = car.placa;
                }
            }
        }

        function closeModal() {
            document.getElementById('carModal').classList.add('hidden');
        }

        function saveCar(e) {
            e.preventDefault();
            const marcaInput = document.getElementById('carMarca').value.trim();
            const marcaNormalized = marcaInput.toLowerCase();

            if (!authorizedBrands.includes(marcaNormalized)) {
                showCustomAlert(`Atenção: A fabricante "${marcaInput}" não foi reconhecida no registro global.`);
                return;
            }

            const anoVal = parseInt(document.getElementById('carAno').value);
            if (anoVal < 1886 || anoVal > 2026) {
                showCustomAlert('Insira um ano de fabricação válido (entre 1886 e 2026).');
                return;
            }

            if (editingCarId) {
                const car = carsDatabase.find(c => c.id === editingCarId);
                if (car) {
                    car.marca = marcaInput;
                    car.modelo = document.getElementById('carModelo').value.trim();
                    car.ano = anoVal;
                    car.placa = document.getElementById('carPlaca').value.toUpperCase();
                }
            } else {
                const newCar = {
                    id: carsDatabase.length > 0 ? Math.max(...carsDatabase.map(c => c.id)) + 1 : 1,
                    marca: marcaInput,
                    modelo: document.getElementById('carModelo').value.trim(),
                    ano: anoVal,
                    placa: document.getElementById('carPlaca').value.toUpperCase()
                };
                carsDatabase.unshift(newCar);
            }

            showCustomAlert('Sucesso! Alteração feita com sucesso.', () => {
                renderCars(carsDatabase);
                closeModal();
            });
        }

        function deleteCurrentCar() {
            if (editingCarId) {
                showCustomConfirm('Tem certeza que deseja apagar este veículo do registro?', () => {
                    carsDatabase = carsDatabase.filter(c => c.id !== editingCarId);
                    showCustomAlert('Sucesso! Veículo apagado com sucesso.', () => {
                        renderCars(carsDatabase);
                        closeModal();
                    });
                });
            }
        }
    </script>
</body>
</html>
